# Nombre del workflow que veremos en GitHub Actions.
name: Tests

# Define CUÁNDO se ejecutará.
on:

  # Se ejecutará cuando hagamos push sobre main.
  push:
    branches:
      - main

  # También se ejecutará cuando exista una Pull Request
  # cuyo destino sea main.
  pull_request:
    branches:
      - main

# Permisos del workflow.
permissions:

  # Solo necesita leer el contenido del repositorio.
  contents: read

# Trabajos que ejecutará el workflow.
jobs:

  # Identificador interno del job.
  coverage:

    # Nombre que veremos en GitHub Actions.
    name: Tests with Coverage

    # Máquina donde se ejecutará.
    runs-on: ubuntu-latest

    # Pasos que realizará, en este orden.
    steps:

      # Descarga nuestro repositorio dentro del runner.
      - uses: actions/checkout@v6

      # Instala/configura Node.js en el runner.
      - uses: actions/setup-node@v6
        with:

          # Usaremos Node.js 24.
          node-version: 24

          # Activa la caché de npm para acelerar instalaciones.
          cache: npm

      # Instala exactamente las dependencias del proyecto
      # definidas en package-lock.json.
      - run: npm ci

      # Ejecuta los tests y genera el informe de cobertura.
      # El informe se guardará en coverage/.
      - run: npm run test:coverage

      # Guarda coverage/ como artifact de GitHub Actions.
      - uses: actions/upload-artifact@v7
        with:

          # Nombre con el que aparecerá el artifact.
          name: test-coverage-report

          # Carpeta que queremos conservar.
          path: coverage/

  # SEGUNDO JOB:
  # Ejecutará tests End-to-End utilizando Playwright.
  # Job que ejecuta las pruebas de navegador.
  e2e:
    name: E2E Tests with Playwright

    # Fijamos Ubuntu 24.04 porque el proyecto utiliza
    # Playwright 1.58.2, que no soporta Chromium
    # sobre el Ubuntu 26.04 que actualmente puede
    # proporcionar ubuntu-latest.
    runs-on: ubuntu-24.04

    steps:

      # Descarga nuestro repositorio dentro del runner.
      - uses: actions/checkout@v6

      # Prepara Node.js.
      - uses: actions/setup-node@v6
        with:

          # Utilizamos Node.js 24.
          node-version: 24

          # Activa la caché de dependencias de npm.
          cache: npm

      # Instala las dependencias exactamente según
      # package-lock.json.
      - run: npm ci

      # Instala Chromium y las dependencias del sistema
      # necesarias para ejecutar los tests de Playwright.
      - run: npx playwright install --with-deps chromium

      # Ejecuta los tests End-to-End del proyecto.
      #
      # Estos tests interactúan con la aplicación
      # utilizando un navegador real automatizado.
      - run: npm run test:e2e

      # Guarda como artifact el informe HTML
      # generado por Playwright.
      - uses: actions/upload-artifact@v7
        with:

          # Esta vez subimos UN único archivo.
          path: playwright-report/index.html

          # IMPORTANTE:
          # evita empaquetar el artifact en ZIP.
          # Podremos abrir index.html directamente.
          archive: false          